<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Můžete změnit fill na barvu podle vašeho tématu -->
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--primary-color-dark, #bbbbbb); stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--primary-color, #555555); stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#moonGrad)" filter="url(#glow)"/>
  <circle cx="65" cy="40" r="40" fill="var(--secondary-color, #f5f5f5)" /> <!-- "Vykousnutí" pro srpek - upravte cx/cy/r pro jiný tvar -->
   <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
      </feMerge>
  </filter>
</svg>
