<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=home.html" />
  <title>YUME</title>
  
  <style>
    body {
      background: linear-gradient(-45deg, #1f1f1f, #111, #1a1a1a, #0f0f0f);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    .fade-in {
      opacity: 1;
      transition: opacity 0.5s ease-in;
    }
    .loader-logo {
    margin-bottom: 1.5rem;
    animation: fadeIn 1s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
  <script>
    document.documentElement.classList.add("fade-out");
  </script>
  <style>
    body {
      background: linear-gradient(-45deg, #1f1f1f, #111, #1a1a1a, #0f0f0f);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    .fade-in {
      opacity: 1;
      transition: opacity 0.5s ease-in;
    }
  </style>
<style>
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }

  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="loader">
    <div class="loader-logo">
      <svg width="120" height="40" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="30" font-family="Helvetica Neue, sans-serif" font-size="28" fill="white" letter-spacing="6">
          YUME
        </text>
      </svg>
    </div>
    <div class="loader-spinner"></div>
  </div>

  <section class="countdown">
    <h1>Nová kolekce přichází za:</h1>
    <div id="countdown"></div>
  </section>

  <section class="wheel">
    <h2>Kolo štěstí 🎡</h2>
    <p>Roztoč a zjisti svůj bonus!</p>
    <button id="spin">Točím!</button>
    <div id="wheel-result"></div>
  </section>
  <div class="loader-spinner"></div>
</div>
  <p>Přesměrování...</p>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.body.classList.add("fade-in");

      const links = document.querySelectorAll("a[href$='.html']");
      links.forEach(link => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          document.body.classList.remove("fade-in");
          document.body.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = this.href;
          }, 300);
        });
      });
    });
  </script>
<script>
  window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    loader.classList.add('hidden');
  });
</script>
<script>
  // Countdown
  const targetDate = new Date("2025-06-01T00:00:00").getTime();
  const countdown = document.getElementById("countdown");
  setInterval(() => {
    const now = new Date().getTime();
    const distance = targetDate - now;
    if (distance < 0) {
      countdown.textContent = "Spuštěno!";
      return;
    }
    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((distance % (1000 * 60)) / 1000);
    countdown.textContent = `${d}d ${h}h ${m}m ${s}s`;
  }, 1000);

  // Wheel of Fortune
  const options = [
    "💥 Sleva 10 % – Kód: YUME10",
    "🖤 Módní tip dne: Černá je vždy správně",
    "✨ Kombinuj textury, ne barvy",
    "🔥 Sleva 15 % nad 3000 Kč",
    "🎁 Doprava zdarma",
    "🧢 Kšiltovka zdarma při nákupu nad 2000 Kč"
  ];
  const btn = document.getElementById("spin");
  const result = document.getElementById("wheel-result");
  if (btn) {
    btn.addEventListener("click", () => {
      const selected = options[Math.floor(Math.random() * options.length)];
      result.textContent = selected;
    });
  }
</script>
</body>
</html>
